<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Удалённая поддержка</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<style>
:root{--brand:#2f6fed;--bg:#0c0f14;--card:rgba(20,24,31,.92)}
*{box-sizing:border-box;margin:0;padding:0}body{font:15px/1.4 -apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:#cbd2d9;height:100vh;display:flex;flex-direction:column}
header{background:var(--card);border-bottom:1px solid rgba(255,255,255,.06);padding:10px 18px;display:flex;align-items:center;gap:14px}
header h1{font-size:15px;font-weight:600;color:#fff;display:flex;align-items:center;gap:8px}
header .bi{color:var(--brand)}
.status{display:flex;align-items:center;gap:6px;font-size:12px;color:#94a3b8;margin-left:auto}
.dot{width:8px;height:8px;border-radius:50%;background:#64748b}
.dot.connecting{background:#eab308;animation:pulse 1s infinite}.dot.connected{background:#22c55e}.dot.failed,.dot.ended{background:#ef4444}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
main{flex:1;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;background:#000}
video{max-width:100%;max-height:100%;cursor:crosshair;touch-action:none}
.placeholder{color:#64748b;font-size:14px;text-align:center;padding:20px}
.clipboard-bar{display:flex;gap:8px;padding:10px 14px;background:var(--card);display:none}
.clipboard-bar input{flex:1;background:var(--bg);border:1px solid rgba(255,255,255,.12);border-radius:8px;color:#e2e8f0;padding:8px 12px}
.cb-btn{background:rgba(255,255,255,.1);color:#e2e8f0;border:none;border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer;white-space:nowrap}
</style></head><body>
<header>
    <h1><i class="bi bi-display"></i> Удалённая поддержка</h1>
    <div class="status"><span class="dot" id="statusDot"></span><span id="statusText">Запуск…</span></div>
</header>
<main id="stage">
    <div class="placeholder" id="placeholder">Ждём подключения терминала — обычно до 30 секунд.</div>
    <video id="video" autoplay playsinline style="display:none"></video>
</main>
<div class="clipboard-bar" id="clipboardBar">
    <input type="text" id="clipboardInput" placeholder="Текст для буфера обмена терминала…">
    <button class="cb-btn" id="clipboardSendBtn">На терминал</button>
    <button class="cb-btn" id="clipboardGetBtn">С терминала</button>
</div>
<script>
const params = new URLSearchParams(location.search);
const sessionId = params.get('session');
let iceServers = [{ urls: `stun:${location.hostname}:3478` }];
try { const raw = params.get('ice'); if (raw) iceServers = JSON.parse(raw); } catch (e) {}
if (!sessionId) document.body.innerHTML = '<p style="padding:20px;color:#e2e8f0">Не указан session (открывайте эту страницу из admin.html)</p>';

let pc = null, dc = null, cursor = 0, pollTimer = null, ended = false;

function setStatus(text, cls) {
    document.getElementById('statusText').textContent = text;
    document.getElementById('statusDot').className = 'dot' + (cls ? ' ' + cls : '');
}

async function api(path, body) {
    const opts = body
        ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }
        : {};
    const r = await fetch(path, opts);
    return r.json();
}

async function start() {
    pc = new RTCPeerConnection({ iceServers });
    pc.ontrack = (e) => {
        const video = document.getElementById('video');
        video.srcObject = e.streams[0];
        document.getElementById('placeholder').style.display = 'none';
        video.style.display = '';
        setStatus('Подключено', 'connected');
        attachControl(video);
    };
    pc.onicecandidate = (e) => {
        if (e.candidate) api(`/api/session/${sessionId}/signal`, { type: 'ice', payload: e.candidate.toJSON() });
    };
    pc.onconnectionstatechange = () => {
        if (pc.connectionState === 'failed' || pc.connectionState === 'closed') setStatus('Соединение потеряно', 'failed');
    };
    pc.ondatachannel = (e) => {
        dc = e.channel;
        dc.onopen = () => { document.getElementById('clipboardBar').style.display = 'flex'; };
        dc.onmessage = (ev) => {
            let msg; try { msg = JSON.parse(ev.data); } catch (e) { return; }
            if (msg.type === 'clipboard_data') {
                document.getElementById('clipboardInput').value = msg.text || '';
                if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(msg.text || '').catch(() => {});
            }
        };
    };

    setStatus('Ждём терминал…', 'connecting');
    pollTimer = setInterval(poll, 1000);
}

async function poll() {
    if (ended) return;
    let res;
    try {
        const r = await fetch(`/api/session/${sessionId}/poll?after=${cursor}`);
        res = await r.json();
    } catch (e) { return; }
    if (!res.ok) { stop('Сеанс не найден или завершён'); return; }
    if (res.status === 'ended') { stop('Сеанс завершён'); return; }

    for (const sig of res.signals) {
        cursor = Math.max(cursor, sig.seq);
        if (sig.type === 'offer') {
            await pc.setRemoteDescription(new RTCSessionDescription(sig.payload));
            const answer = await pc.createAnswer();
            await pc.setLocalDescription(answer);
            await api(`/api/session/${sessionId}/signal`, { type: 'answer', payload: { sdp: answer.sdp, type: answer.type } });
        } else if (sig.type === 'ice') {
            try { await pc.addIceCandidate(sig.payload); } catch (e) {}
        } else if (sig.type === 'bye') {
            stop('Терминал завершил сеанс');
        }
    }
}

function stop(reason) {
    if (ended) return;
    ended = true;
    clearInterval(pollTimer);
    setStatus(reason || 'Завершено', 'ended');
    if (pc) { try { pc.close(); } catch (e) {} }
}

function attachControl(video) {
    function relCoords(clientX, clientY) {
        const r = video.getBoundingClientRect();
        return { x: (clientX - r.left) / r.width, y: (clientY - r.top) / r.height };
    }
    function send(type, x, y) {
        if (dc && dc.readyState === 'open') dc.send(JSON.stringify({ type, x, y, t: Date.now() }));
    }
    video.addEventListener('mousedown', (e) => { const { x, y } = relCoords(e.clientX, e.clientY); send('down', x, y); });
    video.addEventListener('mousemove', (e) => { if (e.buttons) { const { x, y } = relCoords(e.clientX, e.clientY); send('move', x, y); } });
    video.addEventListener('mouseup',   (e) => { const { x, y } = relCoords(e.clientX, e.clientY); send('up', x, y); });
    video.addEventListener('touchstart', (e) => { e.preventDefault(); const t = e.touches[0]; const { x, y } = relCoords(t.clientX, t.clientY); send('down', x, y); }, { passive: false });
    video.addEventListener('touchmove',  (e) => { e.preventDefault(); const t = e.touches[0]; const { x, y } = relCoords(t.clientX, t.clientY); send('move', x, y); }, { passive: false });
    video.addEventListener('touchend',   (e) => { e.preventDefault(); const t = e.changedTouches[0]; const { x, y } = relCoords(t.clientX, t.clientY); send('up', x, y); }, { passive: false });
}

document.getElementById('clipboardSendBtn').addEventListener('click', () => {
    if (dc && dc.readyState === 'open') dc.send(JSON.stringify({ type: 'clipboard_set', text: document.getElementById('clipboardInput').value }));
});
document.getElementById('clipboardGetBtn').addEventListener('click', () => {
    if (dc && dc.readyState === 'open') dc.send(JSON.stringify({ type: 'clipboard_get' }));
});

window.addEventListener('beforeunload', () => {
    if (sessionId && !ended) navigator.sendBeacon(`/api/session/${sessionId}/viewer_end`);
});

if (sessionId) start();
</script>
</body></html>
