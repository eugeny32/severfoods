<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Удалённая поддержка — устройства</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<style>
/* Палитра — та же, что у ntrip.host (см. /assets/style.css самого сервера):
   --brand:#2f6fed, тёмный фон #0c0f14, стеклянные карточки rgba(20,24,31,.92) —
   чтобы карточка приложения и сама панель визуально были одним продуктом
   с сервисом, на котором она живёт, а не случайным набором цветов. */
:root{--brand:#2f6fed;--bg:#0c0f14;--card:rgba(20,24,31,.92)}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 -apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:#cbd2d9}
header{background:var(--card);border-bottom:1px solid rgba(255,255,255,.06);padding:16px 20px;display:flex;align-items:center;gap:10px}
header h1{margin:0;font-size:18px;color:#fff;font-weight:600;display:flex;align-items:center;gap:10px}
header .bi{color:var(--brand);font-size:20px}
main{max-width:900px;margin:20px auto;padding:0 16px}
.gate{max-width:360px;margin:80px auto;padding:24px;background:var(--card);border:1px solid rgba(255,255,255,.06);border-radius:12px}
.gate input{width:100%;padding:10px;border-radius:8px;border:1px solid rgba(255,255,255,.12);background:var(--bg);color:#fff;margin:8px 0}
.gate button,.dev button{background:var(--brand);color:#fff;border:none;border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer}
.dev{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid rgba(255,255,255,.06);border-radius:10px;padding:12px 16px;margin-bottom:10px}
.dot{width:9px;height:9px;border-radius:50%;background:#64748b;flex-shrink:0}
.dot.online{background:#22c55e}
.name{flex:1;color:#fff}.sub{font-size:12px;color:#94a3b8}
</style></head><body>
<header><h1><i class="bi bi-display"></i> Удалённая поддержка — устройства</h1></header>
<main>
<div class="gate" id="gate">
  <p>Введите админский токен (тот же, что в <code>ADMIN_TOKEN</code> на сервере):</p>
  <input type="password" id="tokenInput" placeholder="Токен">
  <button onclick="saveToken()">Войти</button>
</div>
<div id="list" style="display:none"></div>
</main>
<script>
let TOKEN = localStorage.getItem('rs_admin_token') || '';

function saveToken() {
    TOKEN = document.getElementById('tokenInput').value.trim();
    if (!TOKEN) return;
    localStorage.setItem('rs_admin_token', TOKEN);
    document.getElementById('gate').style.display = 'none';
    document.getElementById('list').style.display = '';
    load();
}

async function api(path, opts = {}) {
    const r = await fetch(path, { ...opts, headers: { 'X-Admin-Token': TOKEN, 'Content-Type': 'application/json', ...(opts.headers || {}) } });
    return r.json();
}

function fmtAgo(ts) {
    if (!ts) return 'никогда';
    const sec = Math.floor((Date.now() - ts) / 1000);
    if (sec < 60) return sec + ' с назад';
    if (sec < 3600) return Math.floor(sec / 60) + ' мин назад';
    return Math.floor(sec / 3600) + ' ч назад';
}

async function load() {
    const list = document.getElementById('list');
    const res = await api('/api/devices');
    if (!res.ok) { list.innerHTML = '<p>' + (res.error || 'Ошибка') + '</p>'; return; }
    if (!res.devices.length) { list.innerHTML = '<p style="color:#94a3b8">Ни одно устройство ещё не подключалось.</p>'; return; }

    list.innerHTML = res.devices.map(d => `
        <div class="dev">
            <span class="dot ${d.online ? 'online' : ''}"></span>
            <div class="name">
                <div>${esc(d.name)}</div>
                <div class="sub">${d.online ? 'на связи' : 'был ' + fmtAgo(d.last_seen)}</div>
            </div>
            <button ${d.online ? '' : 'disabled style="opacity:.4"'} onclick="startSession('${d.id}')">Экран</button>
        </div>
    `).join('');
}

function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

async function startSession(deviceId) {
    const res = await api('/api/session/start', { method: 'POST', body: JSON.stringify({ device_id: deviceId }) });
    if (!res.ok) { alert(res.error || 'Не удалось запустить сеанс'); return; }
    // ICE-серверы (включая временные TURN-креды) передаём зрителю тут же —
    // без них он попробует соединиться только через STUN и не пройдёт
    // строгий NAT. Тот же набор уже ушёл терминалу в команде start_session.
    const ice = encodeURIComponent(JSON.stringify(res.ice_servers));
    window.open(`viewer.html?session=${res.session_id}&ice=${ice}`, '_blank', 'width=1100,height=680,noopener');
}

if (TOKEN) { document.getElementById('gate').style.display = 'none'; document.getElementById('list').style.display = ''; load(); setInterval(load, 5000); }
</script>
</body></html>
