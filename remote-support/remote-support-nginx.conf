# remote.ntrip.host -- "Удалённая поддержка" (Эвотор), отдельный продукт.
# Полный отдельный вход домена (не подпуть под ntrip.host): фронтенд admin.html/viewer.html
# использует абсолютные пути /api/... от корня, которые пересеклись бы с уже занятыми
# маршрутами основного сайта, если монтировать как /remote-support/.
#
# Снаружи на 443 стоит HAProxy и раздаёт соединения по SNI (как у meet.ntrip.host,
# llm.ntrip.host и самого ntrip.host) — сюда только 127.0.0.1:8443, не публичный 443.
server {
    listen 80;
    listen [::]:80;
    server_name remote.ntrip.host;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 127.0.0.1:8443 ssl proxy_protocol;
    http2 on;
    server_name remote.ntrip.host;

    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;

    ssl_certificate     /etc/letsencrypt/live/remote.ntrip.host/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/remote.ntrip.host/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/remote-support.access.log;
    error_log  /var/log/nginx/remote-support.error.log;

    # getUserMedia/захват экрана в браузере администратора требует HTTPS — он есть;
    # HSTS закрывает окно для даунгрейда на http при первом заходе.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), display-capture=(self)" always;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
