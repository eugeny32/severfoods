name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      commit_apk:
        description: 'Закоммитить готовый APK в offline/dist/android/'
        type: boolean
        default: true
      allow_unsigned:
        description: 'Разрешить тестовую (debug) сборку, если ключ подписи недоступен'
        type: boolean
        default: false
      build_evotor:
        description: 'Собрать APK для смарт-терминала Эвотор (загружается в кабинет dev.evotor.ru вручную)'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # packages задаём явно. По умолчанию действие ставит «tools
      # platform-tools», а пакет tools Google убрал из репозитория SDK —
      # сборка падала на установке SDK, не дойдя до нашего кода. Сам
      # cmdline-tools действие ставит независимо от этого списка, лицензии
      # принимает тоже; платформу и build-tools догрузит Gradle.
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install dependencies
        run: npm install

      - name: Build web assets
        run: npm run www

      - name: Read version
        id: pkg
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # Иконки собираются из логотипа тем же скриптом, что и локально, —
      # см. android/make-icons.py. Раньше здесь был отдельный кусок кода,
      # который просто масштабировал offline/public/assets/img/icon.png и
      # затирал подготовленные иконки: в APK уезжал не тот значок, который
      # лежит в репозитории, и понять это можно было только вскрыв APK.
      - name: Generate launcher icons
        run: |
          python3 -m pip install --quiet pillow
          python3 make-icons.py

      - name: Sync Capacitor
        run: npx cap sync android

      # Ключ подписи лежит только в секретах репозитория. Проверяем его через
      # переменную окружения, а не через выражение с secrets: значение секрета
      # нельзя подставлять в условие шага.
      - name: Decode signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS:   ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS:    ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS:     ${{ secrets.ANDROID_KEY_PASSWORD }}
          ALLOW_UNSIGNED: ${{ inputs.allow_unsigned }}
        run: |
          # Печатаем только длины — значения секретов в журнал не попадают.
          echo "Видимость секретов (0 = не задан):"
          echo "  ANDROID_KEYSTORE_BASE64:   ${#KEYSTORE_B64}"
          echo "  ANDROID_KEYSTORE_PASSWORD: ${#STORE_PASS}"
          echo "  ANDROID_KEY_ALIAS:         ${#KEY_ALIAS}"
          echo "  ANDROID_KEY_PASSWORD:      ${#KEY_PASS}"

          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | tr -d '\r\n' | base64 -d > "$RUNNER_TEMP/severfoods.jks"
            if [ ! -s "$RUNNER_TEMP/severfoods.jks" ]; then
              echo "::error::Секрет ANDROID_KEYSTORE_BASE64 задан, но не декодируется в файл. Проверьте, что скопировано ВСЁ содержимое severfoods.jks.b64 целиком и без переносов строк."
              exit 1
            fi
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/severfoods.jks" >> "$GITHUB_ENV"
            echo "Ключ подписи получен, собираем боевую сборку."
            exit 0
          fi

          # Раньше здесь молча собиралась debug-версия. Это опасно тем, что
          # выглядит как успех: APK появляется, workflow зелёный, а установить
          # им обновление на планшеты невозможно. Теперь без ключа сборка
          # падает — если тестовая всё же нужна, её просят явно.
          if [ "$ALLOW_UNSIGNED" = "true" ]; then
            echo "::warning::Ключ подписи недоступен — собирается ТЕСТОВАЯ (debug) сборка по явному запросу. Обновить ею установленное приложение будет нельзя."
            exit 0
          fi

          echo "::error::Секрет ANDROID_KEYSTORE_BASE64 пуст — сборке он не виден, поэтому боевой APK собрать нельзя."
          echo "Проверьте, что секреты добавлены именно сюда:"
          echo "  Settings → Secrets and variables → ACTIONS → вкладка Secrets → Repository secrets"
          echo "Частые ошибки: добавлено во вкладку Variables вместо Secrets;"
          echo "добавлено в раздел Codespaces или Dependabot (это другие хранилища, Actions их не видит);"
          echo "опечатка в имени — оно должно быть ровно ANDROID_KEYSTORE_BASE64."
          echo "Если нужна именно тестовая сборка, перезапустите с галочкой «Разрешить тестовую (debug) сборку»."
          exit 1

      # Без ключа подписи release-сборка даёт НЕУСТАНАВЛИВАЕМЫЙ APK: Android
      # отказывается ставить приложение без подписи вообще. Чтобы порт можно
      # было проверить на живом планшете до появления ключа, в этом случае
      # собираем отладочную версию — она подписана служебным ключом Android и
      # ставится нормально.
      - name: Build APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # Идентификатор приложения из кабинета dev.evotor.ru лежит в
          # build.gradle — он не секрет и виден в любом APK. Секрет нужен,
          # только если надо собрать под другое приложение кабинета.
          EVOTOR_APP_UUID: ${{ secrets.EVOTOR_APP_UUID }}
        run: |
          cd android
          chmod +x gradlew

          # Флейворы: tablet — обычный планшет, evotor — смарт-терминал.
          TASKS="assembleTabletRelease"
          DEBUG_TASKS="assembleTabletDebug"
          if [ "${{ inputs.build_evotor }}" = "true" ]; then
            TASKS="$TASKS assembleEvotorRelease"
            DEBUG_TASKS="$DEBUG_TASKS assembleEvotorDebug"
          fi

          if [ -n "${ANDROID_KEYSTORE_PATH:-}" ]; then
            ./gradlew $TASKS --no-daemon
          else
            echo "::warning::Ключ подписи не задан — собирается ТЕСТОВАЯ (debug) сборка. Она пригодна для проверки, но не для рабочих точек: обновить её боевой сборкой можно только с удалением приложения."
            ./gradlew $DEBUG_TASKS --no-daemon
          fi

      - name: Collect APK
        id: apk
        run: |
          mkdir -p ../offline/dist/android
          VER="${{ steps.pkg.outputs.version }}"
          if [ -n "${ANDROID_KEYSTORE_PATH:-}" ]; then
            BUILD=release
            SUFFIX=""
          else
            BUILD=debug
            SUFFIX="-test"
          fi

          # Планшетная сборка
          NAME="SeverFoods-$VER$SUFFIX.apk"
          APK=$(find "android/app/build/outputs/apk/tablet/$BUILD" -name '*.apk' | head -1)
          if [ -z "$APK" ]; then echo "APK планшета не найден"; exit 1; fi
          cp "$APK" "../offline/dist/android/$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

          # Сборка для смарт-терминала Эвотор. В latest-android.json она НЕ
          # попадает: на терминале обновления ставит Эвотор.Маркет, и наш
          # манифест обновлений к ней отношения не имеет.
          if [ "${{ inputs.build_evotor }}" = "true" ]; then
            EV_NAME="SeverFoods-$VER$SUFFIX-evotor.apk"
            EV_APK=$(find "android/app/build/outputs/apk/evotor/$BUILD" -name '*.apk' | head -1)
            if [ -z "$EV_APK" ]; then echo "APK Эвотора не найден"; exit 1; fi
            cp "$EV_APK" "../offline/dist/android/$EV_NAME"
            echo "Готов APK для Эвотора: $EV_NAME (загружается вручную в кабинете dev.evotor.ru)"
          fi

          # Манифест обновления пишем ТОЛЬКО для подписанной сборки: иначе
          # планшеты увидели бы «обновление», которое не сможет установиться.
          if [ -n "${ANDROID_KEYSTORE_PATH:-}" ]; then
            cat > ../offline/dist/android/latest-android.json <<EOF
          {
            "version": "$VER",
            "url": "$NAME",
            "releaseDate": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          fi

      - name: Commit APK into offline/dist/android
        if: ${{ inputs.commit_apk }}
        run: |
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B "${{ github.ref_name }}"
          git add offline/dist/android
          if git diff --cached --quiet; then
            echo "Нет изменений — пропускаем коммит"
          else
            git commit -m "Собрать Android APK v${{ steps.pkg.outputs.version }} [skip ci]"
            # Сборки Windows и Android часто идут одновременно и пишут в одну
            # ветку — та, что финиширует второй, получала отказ «fetch first» и
            # теряла готовый файл. Подкладываем чужой коммит под свой и пробуем
            # ещё раз.
            for attempt in 1 2 3; do
              if git push origin "HEAD:${{ github.ref_name }}"; then break; fi
              echo "Ветка изменилась, переносим коммит поверх (попытка $attempt)"
              git pull --rebase origin "${{ github.ref_name }}"
              sleep 5
            done
          fi

      # Артефакт — только копия для скачивания вручную. Его квота в GitHub
      # исчерпаема, и выпуск (коммит APK в offline/dist) не должен от неё
      # зависеть — поэтому шаг идёт ПОСЛЕ коммита и не валит сборку.
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SeverFoods-${{ steps.pkg.outputs.version }}-apk
          path: offline/dist/android/*
          if-no-files-found: error
        continue-on-error: true
