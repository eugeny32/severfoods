name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      commit_apk:
        description: 'Закоммитить готовый APK в offline/dist/android/'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Build web assets
        run: npm run www

      - name: Read version
        id: pkg
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # Иконка приложения делается из общего логотипа — в среде разработки нет
      # графических утилит, поэтому она собирается здесь, при сборке.
      - name: Generate launcher icons
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image
          import os
          src = Image.open('../offline/public/assets/img/icon.png').convert('RGBA')
          sizes = {'mdpi': 48, 'hdpi': 72, 'xhdpi': 96, 'xxhdpi': 144, 'xxxhdpi': 192}
          for dpi, px in sizes.items():
              d = f'android/app/src/main/res/mipmap-{dpi}'
              os.makedirs(d, exist_ok=True)
              img = src.resize((px, px), Image.LANCZOS)
              img.save(f'{d}/ic_launcher.png')
              img.save(f'{d}/ic_launcher_round.png')
              img.save(f'{d}/ic_launcher_foreground.png')
          print('иконки готовы')
          PY

      - name: Sync Capacitor
        run: npx cap sync android

      # Ключ подписи лежит только в секретах репозитория. Проверяем его через
      # переменную окружения, а не через выражение с secrets: значение секрета
      # нельзя подставлять в условие шага.
      - name: Decode signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "Ключ подписи не задан — будет собран неподписанный APK"
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/severfoods.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/severfoods.jks" >> "$GITHUB_ENV"

      # Без ключа подписи release-сборка даёт НЕУСТАНАВЛИВАЕМЫЙ APK: Android
      # отказывается ставить приложение без подписи вообще. Чтобы порт можно
      # было проверить на живом планшете до появления ключа, в этом случае
      # собираем отладочную версию — она подписана служебным ключом Android и
      # ставится нормально.
      - name: Build APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          if [ -n "${ANDROID_KEYSTORE_PATH:-}" ]; then
            ./gradlew assembleRelease --no-daemon
          else
            echo "::warning::Ключ подписи не задан — собирается ТЕСТОВАЯ (debug) сборка. Она пригодна для проверки, но не для рабочих точек: обновить её боевой сборкой можно только с удалением приложения."
            ./gradlew assembleDebug --no-daemon
          fi

      - name: Collect APK
        id: apk
        run: |
          mkdir -p ../offline/dist/android
          VER="${{ steps.pkg.outputs.version }}"
          if [ -n "${ANDROID_KEYSTORE_PATH:-}" ]; then
            SRC=android/app/build/outputs/apk/release
            NAME="SeverFoods-$VER.apk"
          else
            SRC=android/app/build/outputs/apk/debug
            NAME="SeverFoods-$VER-test.apk"
          fi
          APK=$(find "$SRC" -name '*.apk' | head -1)
          if [ -z "$APK" ]; then echo "APK не найден в $SRC"; exit 1; fi
          cp "$APK" "../offline/dist/android/$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

          # Манифест обновления пишем ТОЛЬКО для подписанной сборки: иначе
          # планшеты увидели бы «обновление», которое не сможет установиться.
          if [ -n "${ANDROID_KEYSTORE_PATH:-}" ]; then
            cat > ../offline/dist/android/latest-android.json <<EOF
          {
            "version": "$VER",
            "url": "$NAME",
            "releaseDate": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SeverFoods-${{ steps.pkg.outputs.version }}-apk
          path: offline/dist/android/*
          if-no-files-found: error

      - name: Commit APK into offline/dist/android
        if: ${{ inputs.commit_apk }}
        run: |
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B "${{ github.ref_name }}"
          git add offline/dist/android
          if git diff --cached --quiet; then
            echo "Нет изменений — пропускаем коммит"
          else
            git commit -m "Собрать Android APK v${{ steps.pkg.outputs.version }} [skip ci]"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
