apply plugin: 'com.android.application'

// Версия берётся из android/package.json — единственного места, где она
// задана, чтобы номер в приложении, в манифесте обновления и в имени APK
// не разъезжались. Файл создаётся скриптом build-www.sh.
def sfVersionName = "1.0.0"
def sfVersionCode = 1
def versionProps = file('../../version.properties')
if (versionProps.exists()) {
    def props = new Properties()
    versionProps.withInputStream { props.load(it) }
    sfVersionName = props.getProperty('versionName', sfVersionName)
    sfVersionCode = props.getProperty('versionCode', String.valueOf(sfVersionCode)) as Integer
}

android {
    namespace "ru.severfoods.offline"
    // AGP 8 по умолчанию не генерирует BuildConfig, а флаг EVOTOR читается
    // из него в MainActivity.
    buildFeatures {
        buildConfig true
    }
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "ru.severfoods.offline"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode sfVersionCode
        versionName sfVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Две сборки из одного кода: для обычного планшета и для смарт-терминала
    // Эвотор. Различаются они не интерфейсом, а правилами площадки:
    // на Эвоторе нельзя захватывать экран (кассир обязан вернуться в меню
    // терминала) и нельзя обновлять себя своим же APK — обновления приходят
    // из Эвотор.Маркета. Всё это включается флагом BuildConfig.EVOTOR.
    flavorDimensions "target"
    productFlavors {
        tablet {
            dimension "target"
            applicationId "ru.severfoods.offline"
            buildConfigField "boolean", "EVOTOR", "false"
        }
        evotor {
            dimension "target"
            // Отдельный пакет: в Эвотор.Маркете приложение живёт своей жизнью,
            // с собственными обновлениями. Общий пакет с планшетной версией
            // означал бы, что одна сборка пытается обновить другую.
            applicationId "ru.severfoods.evotor"
            buildConfigField "boolean", "EVOTOR", "true"
            // app_uuid из личного кабинета dev.evotor.ru — обязателен, без него
            // терминал не признаёт приложение своим.
            //
            // Хранится прямо здесь, а не в секретах: секретом он не является
            // по своей природе — попадает в манифест каждого APK и читается из
            // любого установленного экземпляра. Зато сборка не может молча
            // выйти без него. Переменной окружения можно перекрыть, если
            // понадобится собрать под другое приложение кабинета.
            manifestPlaceholders = [
                evotorAppUuid: (System.getenv("EVOTOR_APP_UUID")
                    ?: "810194c9-02b0-4069-8e45-eab3e85ad4d2")
            ]
        }
    }

    // Ключ подписи в репозитории НЕ хранится: он есть только у заказчика и в
    // секретах GitHub Actions. Без него собирается неподписанный APK — его
    // можно поставить только вручную и нельзя обновить поверх подписанного.
    signingConfigs {
        release {
            def ksPath = System.getenv("ANDROID_KEYSTORE_PATH")
            if (ksPath) {
                storeFile     file(ksPath)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias      System.getenv("ANDROID_KEY_ALIAS")
                keyPassword   System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (System.getenv("ANDROID_KEYSTORE_PATH")) {
                signingConfig signingConfigs.release
            }
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            def suffix = variant.flavorName == 'evotor' ? '-evotor' : ''
            outputFileName = "SeverFoods-${variant.versionName}${suffix}.apk"
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')

    // WebRTC — только сборка для Эвотора (удалённый просмотр/управление
    // экраном терминала, android/EVOTOR.md → «Удалённый доступ»). Планшетной
    // сборке эта зависимость не нужна, поэтому configuration привязан к
    // флейвору (evotorImplementation), а не ко всем сборкам сразу — иначе
    // раздули бы вес APK планшета без всякой пользы.
    evotorImplementation "io.github.webrtc-sdk:android:125.6422.07"

    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
